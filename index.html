<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>БОС Курс</title>
<script>try{if(localStorage.getItem('bos_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3/legacy/build/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f0f;--sur:#1a1a1a;--sur2:#242424;--acc:#f5c518;--tx:#fff;--tx2:#888;--bd:#2a2a2a;--tx3:#555;--r:12px}
[data-theme="light"]{--bg:#f5f5f5;--sur:#ffffff;--sur2:#eeeeee;--acc:#f5c518;--tx:#1a1a1a;--tx2:#666666;--bd:#e0e0e0;--tx3:#999999;--r:12px}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
.nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--bd);z-index:200;transition:background .3s,border-color .3s}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 14px;cursor:pointer;color:var(--tx2);font-size:11px}
.ni.on{color:var(--acc)}
.ni i{font-size:22px;font-style:normal}
.sc{display:none;padding:16px 16px 80px}
.sc.on{display:block}
.hdr{padding:20px 0 8px}
.hdr h1{font-size:26px;font-weight:700}
.hdr p{color:var(--tx2);font-size:14px;margin-top:4px}
.hdr.hdr-logo{display:flex;align-items:center;gap:12px}
.theme-btn{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--sur2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .3s}
.theme-btn svg{width:18px;height:18px;fill:var(--tx2)}
.logo{width:40px;height:40px;border-radius:8px;background:var(--acc);color:#000;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;object-fit:cover}
.stitle{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.8px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{background:var(--sur);border-radius:var(--r);padding:16px;cursor:pointer;border:1px solid var(--bd);transition:background .3s,border-color .3s}
.dcard:active{background:var(--sur2)}
.dcard .n{font-size:28px;font-weight:800;color:var(--acc)}
.dcard .l{font-size:13px;color:var(--tx2);margin-top:4px}
.dcard .c{font-size:11px;color:var(--tx3);margin-top:8px}
.continue-card{background:var(--sur);border-radius:var(--r);padding:16px;margin-bottom:16px;border:2px solid var(--acc);transition:background .3s}
.continue-label{font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.continue-title{font-size:15px;font-weight:600;margin-bottom:10px;line-height:1.3}
.continue-btns{display:flex;gap:8px}
.cbtn-cont{flex:1;padding:10px;background:var(--acc);color:#000;font-size:13px;font-weight:700;border:none;border-radius:8px;cursor:pointer;text-align:center}
.cbtn-new{flex:1;padding:10px;background:transparent;color:var(--tx2);font-size:13px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;text-align:center;transition:border-color .3s}
.back{color:var(--acc);font-size:15px;cursor:pointer;margin-bottom:16px;display:inline-block}
.nav.hidden{display:none}
.mc-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 0 8px}
.mc-hdr h1{font-size:26px;font-weight:700}
.mc-hdr p{color:var(--tx2);font-size:13px;margin-top:2px}
.admin-btn{width:36px;height:36px;border-radius:50%;background:var(--sur2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;flex-shrink:0;transition:background .3s}
.course-card{background:var(--sur);border-radius:var(--r);padding:18px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;border:1px solid var(--bd);transition:background .3s,border-color .3s}
.course-card:active{background:var(--sur2)}
.course-ico{font-size:30px;width:52px;height:52px;border-radius:var(--r);background:var(--sur2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.course-ico img{width:100%;height:100%;object-fit:cover}
.course-info h3{font-size:16px;font-weight:600}
.course-info p{color:var(--tx2);font-size:13px;margin-top:3px}
.course-arrow{margin-left:auto;color:var(--tx2);font-size:18px}
.empty-state{text-align:center;padding:60px 20px;color:var(--tx2)}
.cw-card{cursor:pointer}
.cw-body{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cw-ico{width:44px;height:44px;font-size:22px}
.cw-pbar{width:100%;height:4px;background:var(--bd);border-radius:2px;margin-bottom:12px;overflow:hidden}
.cw-pfill{height:100%;background:var(--acc);border-radius:2px}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{background:var(--sur);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;border:1px solid var(--bd);transition:background .3s,border-color .3s}
.titem:active{background:var(--sur2)}
.titem.current{border-color:var(--acc)}
.tnum{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#000;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tname{font-size:14px;line-height:1.4}
.bcard{background:var(--sur);border-radius:var(--r);padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;border:1px solid var(--bd);transition:background .3s,border-color .3s}
.bcard:active{background:var(--sur2)}
.bico{font-size:36px;flex-shrink:0}
.binfo h3{font-size:15px;font-weight:600}
.binfo p{color:var(--tx2);font-size:13px;margin-top:3px}
.barrow{margin-left:auto;color:var(--tx2);font-size:18px}
.pbadge{background:var(--acc);color:#000;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block}
.pcnt{color:var(--tx2);font-size:13px;display:inline-block;margin-left:8px}
#s-player{display:none;flex-direction:column;padding:16px 16px 80px}
#s-player.on{display:flex}
.vwrap{position:relative;width:100%;background:#000;border-radius:var(--r);overflow:hidden;margin-top:12px;flex-shrink:0}
.vwrap iframe{display:block;width:100%;aspect-ratio:16/9;border:none;pointer-events:none}
.vwrap video{display:block;width:100%;aspect-ratio:16/9;border:none;background:#000;object-fit:contain;pointer-events:none}
.vwrap:not(.yt-mode) iframe,.vwrap:not(.yt-mode) .ytop,.vwrap:not(.yt-mode) .ybot{display:none}
.vwrap:not(.hls-mode) video{display:none}
.ytop{position:absolute;top:0;left:0;right:0;height:60px;background:#000;z-index:11}
.ybot{position:absolute;bottom:0;left:0;right:0;height:50px;background:#000;z-index:11}
.ytap{position:absolute;inset:0;z-index:12;cursor:pointer}
.ctrl{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 35%,rgba(0,0,0,.75) 100%);opacity:0;pointer-events:none;transition:opacity .4s ease}
.ctrl.show{opacity:1;pointer-events:all}
#ctrl.fscover{background:#000;opacity:1;transition:none;z-index:9999}
.center-row{display:flex;align-items:center;justify-content:center;gap:44px;position:absolute;top:50%;left:0;right:0;transform:translateY(-50%)}
.rbtn{width:54px;height:54px;background:none;border:none;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rbtn svg{width:38px;height:38px;fill:#fff;opacity:.9}
.rbtn span{font-size:10px;color:#fff;font-weight:700}
.playbtn{width:66px;height:66px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.5);border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.playbtn svg{width:34px;height:34px;fill:#fff}
.bottom-bar{padding:8px 14px 12px}
.pbar{width:100%;height:4px;background:rgba(255,255,255,.25);border-radius:2px;cursor:pointer;margin-bottom:8px}
.pfill{height:100%;background:var(--acc);border-radius:2px;width:0%}
.time-row{display:flex;align-items:center;justify-content:space-between}
.tdisp{font-size:12px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.fsbtn{background:none;border:none;cursor:pointer;padding:2px;display:flex;align-items:center}
.fsgrp{display:flex;align-items:center;gap:14px}
.fsbtn svg{width:20px;height:20px;fill:#fff}
.fsbtn.active svg{fill:var(--acc)}
.spbtn{font-size:12px;font-weight:700;color:var(--acc);justify-content:center;min-width:28px}
.vwrap.fs{position:fixed!important;top:0;left:0;z-index:9999;border-radius:0;margin:0;background:#000}
.vwrap.fs .ytop,.vwrap.fs .ybot{display:none}
.vwrap.fs iframe,.vwrap.fs video{position:absolute;top:0;left:0;border:none!important;pointer-events:none;object-fit:contain}
.vwrap.fs .ctrl{z-index:30}
.vwrap.fs .ytap{z-index:25}
.fsexit{display:none;position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.55);border:none;align-items:center;justify-content:center;cursor:pointer;z-index:40}
.fsexit svg{width:22px;height:22px;fill:#fff}
.vwrap.fs .fsexit{display:flex}
#p-label{font-size:12px;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.6px;margin-top:14px}
#p-title{font-size:18px;font-weight:700;margin-top:4px;line-height:1.3}
.nbwrap{display:flex;gap:10px;margin-top:16px}
.nbtn{flex:1;padding:13px;border-radius:var(--r);border:1px solid var(--bd);background:var(--sur);color:var(--tx);font-size:14px;cursor:pointer;text-align:center}
.nbtn:disabled{opacity:.3;cursor:default;pointer-events:none}
.nbtn.nx{background:var(--acc);color:#000;font-weight:600;border-color:var(--acc)}

.topic-end{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:30;}
.topic-end.show{display:flex;}
.te-box{text-align:center;padding:24px;}
.te-title{color:#fff;font-size:18px;font-weight:600;margin-bottom:16px;}
.te-btn{display:block;width:220px;margin:8px auto;padding:12px 16px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;}
.te-repeat{background:#2a2a2a;color:#fff;}
.te-next{background:#ffd60a;color:#000;}

#s-pdf{display:none;flex-direction:column;padding:16px 16px 80px;height:100vh}
#s-pdf.on{display:flex}
#s-pdf.fs{position:fixed;inset:0;z-index:9999;padding:8px;height:auto}
#s-pdf.fs .back,#s-pdf.fs #pdf-title{display:none}
#pdf-title{font-size:18px;font-weight:700;margin-bottom:12px;line-height:1.3}
.pdf-wrap{position:relative;flex:1;min-height:0;width:100%;background:var(--sur2);border-radius:var(--r);overflow:auto;margin-bottom:12px;display:flex;align-items:center;justify-content:center}
.pdf-wrap canvas{display:block;transform-origin:center center}
.pdf-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:14px;background:var(--sur2);z-index:5}
.pdf-loading.hide{display:none}
.pdf-toolbar{display:flex;align-items:center;gap:10px;padding-top:4px;flex-shrink:0}
.pdf-zbtn{width:36px;height:36px;border-radius:50%;background:var(--sur);border:1px solid var(--bd);color:var(--tx);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pdf-zbtn svg{width:18px;height:18px;fill:var(--tx)}
.pdf-zlabel{font-size:13px;color:var(--tx2);min-width:42px;text-align:center}
.pdf-pageinfo{margin-left:auto;font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums}
#ver-badge{position:fixed;bottom:2px;right:6px;font-size:10px;color:var(--tx2);opacity:.45;z-index:99999;pointer-events:none}
</style>
</head>
<body>
<div id="ver-badge"></div>
<div id="s-mycourses" class="sc on"><div style="padding:40px 20px;text-align:center;color:var(--tx2)">Загрузка курсов…</div></div>
<div id="s-home" class="sc"></div>
<div id="s-module" class="sc"></div>
<div id="s-days" class="sc"></div>
<div id="s-bonus" class="sc"></div>
<div id="s-tools" class="sc"></div>
<div id="s-player">
  <div id="p-back" class="back">← Назад</div>
  <div id="p-header" style="margin-bottom:12px"></div>
  <div class="vwrap" id="vw">
    <div id="ytpl"></div>
    <video id="vplayer" playsinline webkit-playsinline="true" autopictureinpicture></video>
    <div class="ytop"></div>
    <div class="ybot"></div>
    <div class="ytap" onclick="tapVideo()"></div>
    <div class="topic-end" id="topic-end">
      <div class="te-box">
        <div class="te-title">Тема завершена</div>
        <button class="te-btn te-repeat" onclick="repeatTopic()">↺ Повторить</button>
        <button class="te-btn te-next" id="te-next" onclick="nextTopicFromEnd()">Следующая тема →</button>
      </div>
    </div>
    <div class="topic-end" id="yt-fallback">
      <div class="te-box">
        <div class="te-title">Не удалось загрузить видео</div>
        <button class="te-btn te-next" onclick="openOnYouTube()">Смотреть на YouTube</button>
      </div>
    </div>
    <div class="ctrl" id="ctrl" onclick="if(G.playing)hideCtrl()">
      <div class="center-row">
        <button class="rbtn" onclick="doSeek(-15);event.stopPropagation()"><svg><use href="#i-rew"/></svg><span>15</span></button>
        <button class="playbtn" id="pb" onclick="doPlay();event.stopPropagation()"><svg><use href="#i-play"/></svg></button>
        <button class="rbtn" onclick="doSeek(15);event.stopPropagation()"><svg><use href="#i-fwd"/></svg><span>15</span></button>
      </div>
      <div class="bottom-bar">
        <div class="pbar" onclick="clickBar(event);event.stopPropagation()" onmousedown="pbarStartDrag(event)" ontouchstart="pbarStartDrag(event)"><div class="pfill" id="pf"></div></div>
        <div class="time-row">
          <span class="tdisp"><span id="tc">0:00</span> / <span id="td">0:00</span></span>
          <div class="fsgrp">
            <button class="fsbtn spbtn" id="spb" onclick="cycleSpeed();event.stopPropagation()">1x</button>
            <button class="fsbtn" id="obb" onclick="openInBrowser();event.stopPropagation()"><svg><use href="#i-ext"/></svg></button>
            <button class="fsbtn" id="pipb" onclick="doPiP();event.stopPropagation()"><svg><use href="#i-pip"/></svg></button>
            <button class="fsbtn" id="fsb" onclick="doFS();event.stopPropagation()"><svg><use href="#i-fs"/></svg></button>
          </div>
        </div>
      </div>
    </div>
    <button class="fsexit" id="fsexit" onclick="doFS();event.stopPropagation()"><svg><use href="#i-xfs"/></svg></button>
  </div>
  <div id="p-label"></div>
  <div id="p-title"></div>
  <div class="nbwrap">
    <button class="nbtn" id="btn-prev" onclick="goPrev()">← Предыдущее</button>
    <button class="nbtn nx" id="btn-next" onclick="goNext()">Следующее →</button>
  </div>
</div>
<div id="s-pdf">
  <div class="back" onclick="closePdf()">← Назад</div>
  <div id="pdf-title"></div>
  <div class="pdf-wrap" id="pdf-wrap">
    <canvas id="pdf-canvas"></canvas>
    <div class="pdf-loading" id="pdf-loading">Загрузка…</div>
    <div class="topic-end" id="pdf-fallback">
      <div class="te-box">
        <div class="te-title">Не удалось загрузить PDF</div>
        <button class="te-btn te-next" onclick="openPdfExternally()">Открыть в браузере</button>
        <!-- Temporary — shows reportClientError()'s own send status, since
             neither console access (Eruda) nor Railway logs confirmed the
             report was ever leaving the device. Remove once diagnosed. -->
        <div id="pdf-error-status" style="color:#fff;font-size:12px;margin-top:12px;opacity:.8"></div>
      </div>
    </div>
  </div>
  <div class="pdf-toolbar">
    <button class="pdf-zbtn" onclick="pdfZoomOut()">−</button>
    <span class="pdf-zlabel" id="pdf-zlabel">100%</span>
    <button class="pdf-zbtn" onclick="pdfZoomIn()">+</button>
    <span class="pdf-pageinfo" id="pdf-pageinfo"></span>
    <button class="pdf-zbtn" id="pdf-fsb" onclick="pdfToggleFullscreen()"><svg><use href="#i-fs"/></svg></button>
  </div>
  <div class="nbwrap">
    <button class="nbtn" id="pdf-btn-prev" onclick="pdfGoToPage(PDF.pageNum-1)">← Предыдущая</button>
    <button class="nbtn nx" id="pdf-btn-next" onclick="pdfGoToPage(PDF.pageNum+1)">Следующая →</button>
  </div>
</div>
<nav class="nav hidden">
  <div class="ni on" id="n-home" onclick="goTab('home')"><i>📚</i>Курс</div>
  <div class="ni" id="n-bonus" onclick="goTab('bonus')"><i>🎁</i>Бонусы</div>
  <div class="ni" id="n-tools" onclick="goTab('tools')"><i>🛠</i>Инструменты</div>
</nav>
<svg style="display:none">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
  <symbol id="i-rew" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M12 5v4l5-5-5-5v4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6z"/></symbol>
  <symbol id="i-fs" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></symbol>
  <symbol id="i-xfs" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zM5 5h6V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-6h-2v6H5V5z"/></symbol>
  <symbol id="i-pip" viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zM23 3H1v18h22V3zm-2 16H3V5h18v14z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/></symbol>
