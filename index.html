<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>БОС Курс</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f0f;--sur:#1a1a1a;--sur2:#242424;--acc:#f5c518;--tx:#fff;--tx2:#888;--r:12px}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
.nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid #2a2a2a;z-index:200}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 14px;cursor:pointer;color:var(--tx2);font-size:11px}
.ni.on{color:var(--acc)}
.ni i{font-size:22px;font-style:normal}
.sc{display:none;padding:16px 16px 80px}
.sc.on{display:block}
.hdr{padding:20px 0 8px}
.hdr h1{font-size:26px;font-weight:700}
.hdr p{color:var(--tx2);font-size:14px;margin-top:4px}
.stitle{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.8px;margin:20px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{background:var(--sur);border-radius:var(--r);padding:16px;cursor:pointer;border:1px solid #2a2a2a}
.dcard:active{background:var(--sur2)}
.dcard .n{font-size:28px;font-weight:800;color:var(--acc)}
.dcard .l{font-size:13px;color:var(--tx2);margin-top:4px}
.dcard .c{font-size:11px;color:#555;margin-top:8px}
.back{color:var(--acc);font-size:15px;cursor:pointer;margin-bottom:16px;display:inline-block}
.tlist{display:flex;flex-direction:column;gap:8px}
.titem{background:var(--sur);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;border:1px solid #2a2a2a}
.titem:active{background:var(--sur2)}
.tnum{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#000;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tname{font-size:14px;line-height:1.4}

/* Карточки бонусов и инструментов */
.bcard{background:var(--sur);border-radius:var(--r);padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px;border:1px solid #2a2a2a}
.bcard:active{background:var(--sur2)}
.bico{font-size:36px;flex-shrink:0}
.binfo h3{font-size:15px;font-weight:600}
.binfo p{color:var(--tx2);font-size:13px;margin-top:3px}
.barrow{margin-left:auto;color:var(--tx2);font-size:18px}

.pbadge{background:var(--acc);color:#000;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block}
.pcnt{color:var(--tx2);font-size:13px;display:inline-block;margin-left:8px}

/* ПЛЕЕР — фиксированная структура */
#s-player{display:none;flex-direction:column;padding:16px 16px 80px}
#s-player.on{display:flex}
.vwrap{position:relative;width:100%;background:#000;border-radius:var(--r);overflow:hidden;margin-top:12px;flex-shrink:0}
.vwrap iframe{display:block;width:100%;aspect-ratio:16/9;border:none;pointer-events:none}
.ytop{position:absolute;top:0;left:0;right:0;height:60px;background:#000;z-index:11}
.ybot{position:absolute;bottom:0;left:0;right:0;height:50px;background:#000;z-index:11}
.ytap{position:absolute;inset:0;z-index:12;cursor:pointer}
.ctrl{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 35%,rgba(0,0,0,.75) 100%);transition:opacity .3s;opacity:0;pointer-events:none}
.ctrl.show{opacity:1;pointer-events:all}
.center-row{display:flex;align-items:center;justify-content:center;gap:44px;position:absolute;top:50%;left:0;right:0;transform:translateY(-50%)}
.rbtn{width:54px;height:54px;background:none;border:none;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rbtn svg{width:38px;height:38px;fill:#fff;opacity:.9}
.rbtn span{font-size:10px;color:#fff;font-weight:700}
.playbtn{width:66px;height:66px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.5);border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.playbtn svg{width:34px;height:34px;fill:#fff}
.bottom-bar{padding:8px 14px 12px}
.pbar{width:100%;height:4px;background:rgba(255,255,255,.25);border-radius:2px;cursor:pointer;margin-bottom:8px}
.pfill{height:100%;background:var(--acc);border-radius:2px;width:0%}
.time-row{display:flex;align-items:center;justify-content:space-between}
.tdisp{font-size:12px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.fsbtn{background:none;border:none;cursor:pointer;padding:2px;display:flex;align-items:center}
.fsbtn svg{width:20px;height:20px;fill:#fff}
.vwrap.fs{position:fixed!important;top:0;left:0;width:100vw!important;height:100vh!important;z-index:9999;border-radius:0;margin:0}
.vwrap.fs iframe{width:100vw!important;height:100vh!important;aspect-ratio:unset!important}
#p-label{font-size:12px;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.6px;margin-top:14px}
#p-title{font-size:18px;font-weight:700;margin-top:4px;line-height:1.3}
.nbwrap{display:flex;gap:10px;margin-top:16px}
.nbtn{flex:1;padding:13px;border-radius:var(--r);border:1px solid #2a2a2a;background:var(--sur);color:var(--tx);font-size:14px;cursor:pointer;text-align:center}
.nbtn:disabled{opacity:.3;cursor:default;pointer-events:none}
.nbtn.nx{background:var(--acc);color:#000;font-weight:600;border-color:var(--acc)}
</style>
</head>
<body>

<div id="s-home" class="sc on"></div>
<div id="s-days" class="sc"></div>
<div id="s-bonus" class="sc"></div>
<div id="s-tools" class="sc"></div>

<!-- ПЛЕЕР — один на всё приложение, не пересоздаётся -->
<div id="s-player">
  <div id="p-back" class="back">← Назад</div>
  <div id="p-header" style="margin-bottom:12px"></div>
  <div class="vwrap" id="vw">
    <div id="ytpl"></div>
    <div class="ytop"></div>
    <div class="ybot"></div>
    <div class="ytap" onclick="showCtrl()"></div>
    <div class="ctrl" id="ctrl">
      <div class="center-row">
        <button class="rbtn" onclick="doSeek(-15);event.stopPropagation()">
          <svg><use href="#i-rew"/></svg><span>15</span>
        </button>
        <button class="playbtn" id="pb" onclick="doPlay();event.stopPropagation()">
          <svg><use href="#i-play"/></svg>
        </button>
        <button class="rbtn" onclick="doSeek(15);event.stopPropagation()">
          <svg><use href="#i-fwd"/></svg><span>15</span>
        </button>
      </div>
      <div class="bottom-bar">
        <div class="pbar" onclick="clickBar(event);event.stopPropagation()">
          <div class="pfill" id="pf"></div>
        </div>
        <div class="time-row">
          <span class="tdisp"><span id="tc">0:00</span> / <span id="td">0:00</span></span>
          <button class="fsbtn" id="fsb" onclick="doFS();event.stopPropagation()">
            <svg><use href="#i-fs"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div id="p-label"></div>
  <div id="p-title"></div>
  <div class="nbwrap">
    <button class="nbtn" id="btn-prev" onclick="goPrev()">← Предыдущее</button>
    <button class="nbtn nx" id="btn-next" onclick="goNext()">Следующее →</button>
  </div>
</div>

<nav class="nav">
  <div class="ni on" id="n-home" onclick="goTab('home')"><i>📚</i>Курс</div>
  <div class="ni" id="n-bonus" onclick="goTab('bonus')"><i>🎁</i>Бонусы</div>
  <div class="ni" id="n-tools" onclick="goTab('tools')"><i>🛠</i>Инструменты</div>
</nav>

<svg style="display:none">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></symbol>
  <symbol id="i-rew" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M12 5v4l5-5-5-5v4c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6z"/></symbol>
  <symbol id="i-fs" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></symbol>
  <symbol id="i-xfs" viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></symbol>
</svg>

<script src="data.js"></script>
<script>
// Состояние
var G = {
  topics: [],      // текущий список тем (дни / бонус / инструмент)
  idx: 0,
  backFn: null,    // функция кнопки "Назад"
  badgeText: '',   // текст бейджа (ДЕНЬ 1 / БОНУС 1 / ...)
  player: null,
  ytReady: false,
  playing: false,
  ready: false,
  fs: false,
  pendingVid: null,
  ctrlTimer: null,
  progTimer: null
};

// YouTube API — один плеер на всё время
(function(){ var t=document.createElement('script'); t.src='https://www.youtube.com/iframe_api'; document.head.appendChild(t); })();

function onYouTubeIframeAPIReady(){
  G.ytReady = true;
  G.player = new YT.Player('ytpl', {
    playerVars: { controls:0, disablekb:1, fs:0, modestbranding:1, rel:0, showinfo:0, iv_load_policy:3, playsinline:1, enablejsapi:1 },
    events: {
      onReady: function(){
        if(G.pendingVid){ G.player.loadVideoById(G.pendingVid); G.pendingVid=null; }
      },
      onStateChange: function(e){
        G.playing = (e.data === YT.PlayerState.PLAYING);
        if(G.playing){ G.ready=true; startProg(); } else { clearInterval(G.progTimer); }
        syncPB();
      }
    }
  });
}

function loadVideo(vid){
  clearInterval(G.progTimer);
  G.ready=false; G.playing=false; syncPB();
  var pf=document.getElementById('pf'); if(pf) pf.style.width='0%';
  var tc=document.getElementById('tc'); if(tc) tc.textContent='0:00';
  var td=document.getElementById('td'); if(td) td.textContent='0:00';
  if(G.ytReady && G.player && G.player.loadVideoById){
    G.player.loadVideoById(vid);
    G.ready=true; showCtrl();
  } else {
    G.pendingVid=vid;
  }
}

function doPlay(){ if(!G.player||!G.ytReady)return; try{ G.playing?G.player.pauseVideo():G.player.playVideo(); }catch(e){} }
function doSeek(d){ if(!G.player||!G.ytReady)return; try{ G.player.seekTo(Math.max(0,G.player.getCurrentTime()+d),true); }catch(e){} }

function startProg(){
  clearInterval(G.progTimer);
  G.progTimer=setInterval(function(){
    if(!G.player||!G.ytReady)return;
    try{
      var cur=G.player.getCurrentTime(), dur=G.player.getDuration();
      if(!dur)return;
      var pf=document.getElementById('pf'); if(pf) pf.style.width=(cur/dur*100)+'%';
      var tc=document.getElementById('tc'); if(tc) tc.textContent=fmt(cur);
      var td=document.getElementById('td'); if(td) td.textContent=fmt(dur);
    }catch(e){}
  },500);
}

function fmt(s){ s=Math.floor(s||0); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
function syncPB(){ var b=document.getElementById('pb'); if(!b)return; b.innerHTML=G.playing?'<svg><use href="#i-pause"/></svg>':'<svg><use href="#i-play"/></svg>'; }

function clickBar(e){
  if(!G.player||!G.ytReady)return;
  try{ var r=e.currentTarget.getBoundingClientRect(); G.player.seekTo(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*G.player.getDuration(),true); }catch(e){}
}

function doFS(){
  var w=document.getElementById('vw'); if(!w)return;
  var req=w.requestFullscreen||w.webkitRequestFullscreen;
  var fsEl=document.fullscreenElement||document.webkitFullscreenElement;
  if(fsEl){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  else if(req){ req.call(w).then(function(){G.fs=true;syncFS();}).catch(function(){cssFS(w);}); }
  else{ cssFS(w); }
}
function cssFS(w){ G.fs=!G.fs; w.classList.toggle('fs',G.fs); document.body.style.overflow=G.fs?'hidden':''; var f=w.querySelector('iframe'); if(f) f.style.cssText=G.fs?'width:100vw!important;height:100vh!important;aspect-ratio:unset!important':''; syncFS(); }
function syncFS(){ var b=document.getElementById('fsb'); if(!b)return; b.innerHTML=G.fs?'<svg><use href="#i-xfs"/></svg>':'<svg><use href="#i-fs"/></svg>'; }
document.addEventListener('fullscreenchange',function(){ if(!document.fullscreenElement){G.fs=false;syncFS();} });
document.addEventListener('webkitfullscreenchange',function(){ if(!document.webkitFullscreenElement){G.fs=false;syncFS();} });

function showCtrl(){
  var c=document.getElementById('ctrl'); if(!c)return;
  c.classList.add('show');
  clearTimeout(G.ctrlTimer);
  G.ctrlTimer=setTimeout(function(){ if(G.playing) c.classList.remove('show'); },3500);
}

function stopVideo(){
  clearInterval(G.progTimer); clearTimeout(G.ctrlTimer);
  if(G.player&&G.ytReady){ try{G.player.stopVideo();}catch(e){} }
  G.playing=false; syncPB();
}

// ── УНИВЕРСАЛЬНЫЙ ПЛЕЕР ──────────────────────────────
// Принимает список тем, индекс, текст бейджа, функцию "назад"
function openPlayer(topics, idx, badgeText, backFn){
  G.topics   = topics;
  G.idx      = idx;
  G.badgeText= badgeText;
  G.backFn   = backFn;

  var tp    = G.topics[G.idx];
  var total = G.topics.length;
  var vid   = getVid(tp.url);

  document.getElementById('p-back').onclick = G.backFn;
  document.getElementById('p-header').innerHTML =
    '<span class="pbadge">'+G.badgeText+'</span>'
    +'<span class="pcnt">'+(G.idx+1)+' из '+total+'</span>';
  document.getElementById('p-label').textContent = G.badgeText+' — '+(G.idx+1);
  document.getElementById('p-label').style.cssText='font-size:12px;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.6px;margin-top:14px';
  document.getElementById('p-title').textContent  = tp.title;
  document.getElementById('p-title').style.cssText='font-size:18px;font-weight:700;margin-top:4px;line-height:1.3';

  document.getElementById('btn-prev').disabled = (G.idx===0);
  document.getElementById('btn-next').disabled = (G.idx===total-1);

  // Показываем экран плеера
  document.querySelectorAll('.sc,#s-player').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('on');});
  document.getElementById('s-player').classList.add('on');

  loadVideo(vid);
}

function goPrev(){ if(G.idx>0) openPlayer(G.topics, G.idx-1, G.badgeText, G.backFn); }
function goNext(){ if(G.idx<G.topics.length-1) openPlayer(G.topics, G.idx+1, G.badgeText, G.backFn); }

function getVid(url){
  if(!url)return'';
  var m=url.match(/(?:youtu\.be\/|[?&]v=|\/embed\/)([^&?/]{11})/);
  return m?m[1]:'';
}

// ── TABS ─────────────────────────────────────────────
function goTab(t){
  document.querySelectorAll('.sc,#s-player').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('on');});
  document.getElementById('s-'+t).classList.add('on');
  document.getElementById('n-'+t).classList.add('on');
  stopVideo();
}

// ── HOME ─────────────────────────────────────────────
function buildHome(){
  var h='<div class="hdr"><h1>БОС Курс</h1><p>Бизнес Операционная Система</p></div>'
    +'<div class="stitle">Программа курса</div><div class="grid">';
  COURSE_DATA.days.forEach(function(d){
    h+='<div class="dcard" onclick="openDay('+d.id+')">'
      +'<div class="n">'+d.id+'</div>'
      +'<div class="l">'+d.title+'</div>'
      +'<div class="c">'+d.topics.length+' тем</div>'
      +'</div>';
  });
  document.getElementById('s-home').innerHTML=h+'</div>';
}

// ── DAY ──────────────────────────────────────────────
function openDay(id){
  var day=null;
  for(var i=0;i<COURSE_DATA.days.length;i++){ if(COURSE_DATA.days[i].id===id){day=COURSE_DATA.days[i];break;} }
  if(!day)return;

  var h='<div class="back" onclick="goHome()">← Назад</div>'
    +'<div style="margin-bottom:16px"><div style="font-size:22px;font-weight:700">День '+day.id+'</div>'
    +'<div style="color:var(--tx2);font-size:13px;margin-top:4px">'+day.title+'</div></div>'
    +'<div class="tlist">';
  day.topics.forEach(function(tp,i){
    h+='<div class="titem" onclick="openDayVideo('+day.id+','+i+')">'
      +'<div class="tnum">'+(i+1)+'</div>'
      +'<div class="tname">'+tp.title+'</div>'
      +'</div>';
  });
  document.getElementById('s-days').innerHTML=h+'</div>';

  document.querySelectorAll('.sc,#s-player').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('on');});
  document.getElementById('s-days').classList.add('on');
  document.getElementById('n-home').classList.add('on');
}

function openDayVideo(dayId, idx){
  var day=null;
  for(var i=0;i<COURSE_DATA.days.length;i++){ if(COURSE_DATA.days[i].id===dayId){day=COURSE_DATA.days[i];break;} }
  if(!day)return;
  openPlayer(day.topics, idx, 'ДЕНЬ '+dayId, function(){ openDay(dayId); });
}

function goHome(){
  stopVideo();
  document.querySelectorAll('.sc,#s-player').forEach(function(s){s.classList.remove('on');});
  document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('on');});
  document.getElementById('s-home').classList.add('on');
  document.getElementById('n-home').classList.add('on');
}

// ── BONUS ────────────────────────────────────────────
function buildBonus(){
  var h='<div class="hdr"><h1>Бонусы</h1><p>Дополнительные материалы</p></div>';
  COURSE_DATA.bonuses.forEach(function(b,i){
    h+='<div class="bcard" onclick="openBonus('+i+')">'
      +'<div class="bico">'+b.icon+'</div>'
      +'<div class="binfo"><h3>'+b.title+'</h3><p>'+b.desc+'</p></div>'
      +'<div class="barrow">▶</div>'
      +'</div>';
  });
  document.getElementById('s-bonus').innerHTML=h;
}

function openBonus(i){
  var b=COURSE_DATA.bonuses[i];
  openPlayer(b.topics, 0, 'БОНУС '+(i+1), function(){ goTab('bonus'); });
}

// ── TOOLS ────────────────────────────────────────────
function buildTools(){
  var h='<div class="hdr"><h1>Инструменты</h1><p>Менеджмент практикум</p></div>';
  COURSE_DATA.tools.forEach(function(t,i){
    h+='<div class="bcard" onclick="openTool('+i+')">'
      +'<div class="bico">'+t.icon+'</div>'
      +'<div class="binfo"><h3>'+t.title+'</h3><p>'+t.desc+'</p></div>'
      +'<div class="barrow">▶</div>'
      +'</div>';
  });
  document.getElementById('s-tools').innerHTML=h;
}

function openTool(i){
  var t=COURSE_DATA.tools[i];
  openPlayer(t.topics, 0, t.title.toUpperCase(), function(){ goTab('tools'); });
}

buildHome(); buildBonus(); buildTools();
</script>
</body>
</html>
