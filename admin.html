<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BilimBook — Админ</title>
<script>try{if(localStorage.getItem('bos_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f0f;--sur:#1a1a1a;--sur2:#242424;--acc:#f5c518;--tx:#fff;--tx2:#888;--bd:#2a2a2a;--tx3:#555;--r:12px}
[data-theme="light"]{--bg:#f5f5f5;--sur:#ffffff;--sur2:#eeeeee;--acc:#f5c518;--tx:#1a1a1a;--tx2:#666666;--bd:#e0e0e0;--tx3:#999999;--r:12px}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
#app{padding:16px 16px 40px}
.hdr{padding:20px 0 8px}
.hdr h1{font-size:24px;font-weight:700;margin-top:6px}
.hdr p{color:var(--tx2);font-size:13px;margin-top:4px}
.back{color:var(--acc);font-size:15px;cursor:pointer;display:inline-block}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.titem{background:var(--sur);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;border:1px solid var(--bd);transition:background .3s,border-color .3s}
.titem:active{background:var(--sur2)}
.uname{font-size:15px;font-weight:600}
.umeta{color:var(--tx2);font-size:13px;margin-top:2px}
.barrow{margin-left:auto;color:var(--tx2);font-size:18px}
.empty-state{text-align:center;padding:60px 20px;color:var(--tx2)}
.loading{padding:40px 20px;text-align:center;color:var(--tx2)}
.ccheck{display:flex;align-items:center;gap:12px;background:var(--sur);border-radius:var(--r);padding:14px 16px;border:1px solid var(--bd);cursor:pointer}
.ccheck input{width:20px;height:20px;accent-color:var(--acc)}
.cico{font-size:20px}
.ctitle{font-size:15px}
.save-btn{width:100%;margin-top:16px;padding:14px;background:var(--acc);color:#000;font-size:15px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer}
#save-status{text-align:center;margin-top:10px;color:var(--tx2);font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="app"><div class="loading">Загрузка…</div></div>
<script src="admin.js"></script>
</body>
</html>
