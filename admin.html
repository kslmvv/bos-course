<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BilimBook — Админ</title>
<script>try{if(localStorage.getItem('bos_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f0f0f;--sur:#1a1a1a;--sur2:#242424;--acc:#f5c518;--tx:#fff;--tx2:#888;--bd:#2a2a2a;--tx3:#555;--r:12px}
[data-theme="light"]{--bg:#f5f5f5;--sur:#ffffff;--sur2:#eeeeee;--acc:#f5c518;--tx:#1a1a1a;--tx2:#666666;--bd:#e0e0e0;--tx3:#999999;--r:12px}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
#app{padding:16px 16px 40px}
.hdr{padding:20px 0 8px}
.hdr h1{font-size:24px;font-weight:700;margin-top:6px}
.hdr p{color:var(--tx2);font-size:13px;margin-top:4px}
.back{color:var(--acc);font-size:15px;cursor:pointer;display:inline-block}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.titem{background:var(--sur);border-radius:var(--r);padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;border:1px solid var(--bd);transition:background .3s,border-color .3s}
.titem:active{background:var(--sur2)}
.uname{font-size:15px;font-weight:600}
.umeta{color:var(--tx2);font-size:13px;margin-top:2px}
.barrow{margin-left:auto;color:var(--tx2);font-size:18px}
.empty-state{text-align:center;padding:60px 20px;color:var(--tx2)}
.loading{padding:40px 20px;text-align:center;color:var(--tx2)}
.ccheck{display:flex;align-items:center;gap:12px;background:var(--sur);border-radius:var(--r);padding:14px 16px;border:1px solid var(--bd);cursor:pointer}
.ccheck input{width:20px;height:20px;accent-color:var(--acc)}
.cico{font-size:20px;display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;flex-shrink:0}
.cico img{width:100%;height:100%;object-fit:cover;border-radius:4px}
.ctitle{font-size:15px}
.save-btn{width:100%;margin-top:16px;padding:14px;background:var(--acc);color:#000;font-size:15px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer}
#save-status{text-align:center;margin-top:10px;color:var(--tx2);font-size:13px;min-height:18px}
.hdr-row{display:flex;align-items:center;justify-content:space-between}
.add-user-btn{width:36px;height:36px;border-radius:50%;background:var(--sur2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;color:var(--tx);flex-shrink:0}
.tabs{display:flex;gap:8px;margin:14px 0}
.tab-btn{flex:1;padding:10px;border-radius:var(--r);border:1px solid var(--bd);background:var(--sur);color:var(--tx2);font-size:14px;cursor:pointer;text-align:center}
.tab-btn.active{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.text-input{width:100%;padding:14px;border-radius:var(--r);border:1px solid var(--bd);background:var(--sur);color:var(--tx);font-size:15px;margin-bottom:14px}
.text-input::placeholder{color:var(--tx3)}
.section-label{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
#add-status{text-align:center;margin-top:10px;color:var(--tx2);font-size:13px;min-height:18px}
.danger-btn{width:100%;margin-top:12px;padding:14px;background:transparent;color:#e5484d;font-size:15px;font-weight:700;border:1px solid #e5484d;border-radius:var(--r);cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal-box{background:var(--sur);border-radius:var(--r);padding:20px;max-width:340px;width:100%;border:1px solid var(--bd)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:10px}
.modal-warn{color:#e5484d;font-size:13px;margin-bottom:16px;line-height:1.4}
.modal-btns{display:flex;gap:10px}
.modal-btn{flex:1;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.modal-cancel{background:var(--sur2);color:var(--tx)}
.modal-confirm{background:#e5484d;color:#fff}
.hdr-btns{display:flex;gap:8px}
.stats-btn{width:36px;height:36px;border-radius:50%;background:var(--sur2);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--tx);flex-shrink:0}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.metric-card{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);padding:16px;text-align:center}
.metric-value{font-size:26px;font-weight:800;color:var(--acc)}
.metric-label{font-size:12px;color:var(--tx2);margin-top:4px}
.engagement-row{background:var(--sur);border-radius:var(--r);border:1px solid var(--bd);padding:12px 14px;margin-bottom:10px}
.engagement-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.progress-track{width:100%;height:6px;background:var(--sur2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--acc);border-radius:3px}
.activity-topic{color:var(--tx2);font-size:13px;margin-top:2px}
.activity-meta{color:var(--tx3);font-size:12px;margin-top:2px}
.topic-row{display:flex;align-items:center;gap:8px}
.topic-row .text-input{margin-bottom:8px}
.topic-time-input{width:70px;flex-shrink:0;text-align:center;padding-left:4px;padding-right:4px}
.topic-title-input{flex:1;min-width:0}
.topic-del-btn{width:36px;height:36px;border-radius:50%;background:var(--sur2);border:none;color:#e5484d;font-size:16px;cursor:pointer;flex-shrink:0;margin-bottom:8px}
.icon-upload-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.icon-preview{width:48px;height:48px;border-radius:10px;background:var(--sur);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;font-size:20px;color:var(--tx3)}
.icon-preview img{width:100%;height:100%;object-fit:cover}
.icon-file-label{flex:1;padding:12px 14px;border-radius:var(--r);border:1px dashed var(--bd);background:var(--sur);color:var(--tx2);font-size:14px;text-align:center;cursor:pointer}
</style>
</head>
<body>
<div id="app"><div class="loading">Загрузка…</div></div>
<script src="admin.js?v=etap2-25"></script>
</body>
</html>
